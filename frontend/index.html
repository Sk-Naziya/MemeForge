
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meme Generator | Welcome</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="page-login">
  <main class="login-wrap">
    <a class="brand" href="index.html"><span class="brand-icon">M</span> MemeGenerator</a>
    <section class="glass login-card">
      <span class="eyebrow">YOUR CREATIVE PLAYGROUND</span>
      <h1>Make something <span>memorable.</span></h1>
      <p class="muted">Your ideas. Your humor. Your masterpiece.</p>

      <form id="loginForm">
        <label for="username">Email</label>
        <input id="username" maxlength="35" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>

        <button class="btn primary full" type="submit">Enter the studio ↗</button>
      </form>
      <p class="hint">Guest demo only — no account is created.</p>
    </section>
    <p class="footer">Made for big laughs and little moments ✦</p>
  </main>
</body>
</html>
